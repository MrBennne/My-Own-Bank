name: banking_mobile
description: Personal banking dashboard for PocketBase backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.1

  # Charts
  fl_chart: ^0.69.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # File picker for CSV import
  file_picker: ^8.1.2

  # Intl for date/number formatting
  intl: ^0.19.0

  # Cupertino icons (optional)
  cupertino_icons: ^1.0.8

  # Persistent key-value storage for settings
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
