{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-0">Run Output</h4>
    <span class="text-muted small">
      {% if returncode == 0 %}
        <span class="text-success">Completed successfully</span>
      {% else %}
        <span class="text-danger">Exited with code {{ returncode }}</span>
      {% endif %}
    </span>
  </div>
  <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="card">
  <div class="card-body p-0">
    <pre class="p-3 mb-0 font-monospace small" style="white-space: pre-wrap; word-break: break-all; max-height: 600px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; border-radius: 0.375rem;">{% if output %}{{ output }}{% else %}(no output){% endif %}</pre>
  </div>
</div>

{% endblock %}
