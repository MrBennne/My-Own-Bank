{% extends 'base.html' %}
{% block content %}

<h4 class="fw-bold mb-1">Import Transactions</h4>
<p class="text-muted small mb-4">Upload a bank export CSV to import new transactions into PocketBase.</p>

<div class="card p-4" style="max-width:480px">
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label fw-semibold">Bank export CSV</label>
      <input type="file" name="csv_file" accept=".csv" class="form-control" required>
      <div class="form-text">Semicolon-delimited, European number format (1.234,56)</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-upload me-1"></i>Import
    </button>
  </form>
</div>

{% endblock %}
