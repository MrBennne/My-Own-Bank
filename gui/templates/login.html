<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My-Own-Bank – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1d23; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 360px; }
  </style>
</head>
<body>
<div class="card login-card shadow-lg border-0">
  <div class="card-body p-4">
    <h4 class="mb-1 fw-bold">My-Own-Bank</h4>
    <p class="text-muted small mb-4">Enter your GUI password to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
